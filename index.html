<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAUNCHPAD // PROGRAM OPS</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --bg2:#111114; --bg3:#16161b; --bg4:#1c1c22;
    --line:#1f1f26; --line2:#2a2a33; --line3:#383842;
    --text:#e8e8ec; --dim:#9a9aa5; --faint:#5a5a64;
    --amber:#ffb000; --green:#00d97e; --red:#ff3b3b;
    --lp:#e6113b;
    --mono:'JetBrains Mono',monospace;
    --display:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:var(--bg); color:var(--text);
    font-family:var(--mono); height:100vh; width:100vw;
    overflow:hidden;
  }

  .shell{
    height:100vh; width:100vw;
    display:grid;
    grid-template-rows: 60px 1fr;
  }

  /* ===== COMBINED BAR ===== */
  .bar{
    display:flex; align-items:stretch;
    border-bottom:1px solid var(--line);
    background:var(--bg2);
    overflow:hidden;
  }

  /* brand block */
  .brand{
    display:flex; align-items:center; gap:14px;
    padding:0 22px;
    border-right:1px solid var(--line);
    flex-shrink:0;
  }
  .lp-mark{width:30px; height:30px}
  .lp-mark svg{width:100%; height:100%; display:block}
  .brand-text{
    font-family:var(--display);
    font-weight:700; font-size:15px;
    letter-spacing:.2em;
    display:flex; align-items:flex-start; gap:4px;
    line-height:1;
  }
  .brand-text .build{color:var(--lp)}
  .brand-text .ai{
    font-size:9px; letter-spacing:.15em; color:var(--dim);
    margin-top:1px; font-weight:500;
  }

  /* nav strip */
  .nav{
    display:flex; align-items:stretch;
    flex:1; min-width:0;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none}

  .nav-label{
    display:flex; align-items:center;
    font-size:9px; letter-spacing:.28em; color:var(--faint);
    padding:0 18px;
    border-right:1px solid var(--line);
    flex-shrink:0;
  }

  .nav-btn{
    position:relative;
    display:flex; align-items:center; gap:11px;
    padding:0 18px;
    background:transparent; border:none;
    color:var(--dim); font-family:var(--mono);
    cursor:pointer;
    height:100%;
    border-right:1px solid var(--line);
    transition:color .15s ease, background .15s ease;
    flex-shrink:0;
  }
  .nav-btn:hover{ color:var(--text); background:var(--bg3) }
  .nav-btn.active{ color:var(--text); background:var(--bg3) }
  .nav-btn.active::before{
    content:''; position:absolute; bottom:-1px; left:0; right:0;
    height:2px; background:var(--lp);
    box-shadow:0 0 12px rgba(230,17,59,.5);
  }
  .nav-btn.active::after{
    content:''; position:absolute; top:0; left:0; right:0;
    height:1px; background:linear-gradient(90deg, transparent, rgba(230,17,59,.4), transparent);
  }

  .nav-mark{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg4);
    border:1px solid var(--line2);
    flex-shrink:0;
    transition:border-color .15s ease, background .15s ease;
  }
  .nav-mark svg{width:16px; height:16px; display:block}
  .nav-btn.active .nav-mark{
    border-color:var(--lp);
    background:rgba(230,17,59,.08);
  }
  .nav-btn:hover .nav-mark{border-color:var(--line3)}

  .nav-text{
    display:flex; flex-direction:column;
    text-align:left;
    gap:1px;
    line-height:1.15;
  }
  .nav-customer{
    font-family:var(--display);
    font-size:12px; font-weight:600;
    letter-spacing:.03em;
    color:inherit;
    white-space:nowrap;
  }
  .nav-code{
    font-size:8.5px; letter-spacing:.18em;
    color:var(--faint);
    white-space:nowrap;
  }
  .nav-btn.active .nav-code{color:var(--dim)}

  .nav-status{
    width:5px; height:5px; border-radius:50%;
    background:var(--line3);
    margin-left:2px;
    flex-shrink:0;
  }
  .nav-btn[data-status="active"] .nav-status{background:var(--green)}
  .nav-btn[data-status="warn"] .nav-status{background:var(--amber)}
  .nav-btn[data-status="crit"] .nav-status{background:var(--red)}

  /* meta cluster (right) */
  .meta{
    display:flex; align-items:stretch;
    border-left:1px solid var(--line);
    flex-shrink:0;
  }
  .pill{
    display:flex; align-items:center; gap:9px;
    font-size:9px; letter-spacing:.26em; color:var(--dim);
    padding:0 18px;
    border-right:1px solid var(--line);
  }
  .pill::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--green); box-shadow:0 0 8px var(--green);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .clock{
    display:flex; align-items:center; gap:10px;
    font-size:10px; letter-spacing:.18em; color:var(--dim);
    padding:0 22px;
  }
  .clock b{color:var(--text); font-weight:500; font-variant-numeric:tabular-nums}

  /* ===== VIEW ===== */
  .view{ position:relative; background:var(--bg); overflow:hidden }
  .view iframe{
    width:100%; height:100%;
    border:none; display:block;
    background:var(--bg);
  }

  .loader{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    color:var(--dim);
    font-size:10px; letter-spacing:.32em;
    opacity:0; pointer-events:none;
    transition:opacity .15s ease;
    z-index:2;
  }
  .loader.show{opacity:1}
  .loader::before{
    content:''; width:8px; height:8px; background:var(--lp);
    margin-right:14px; animation:blink .8s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  /* responsive */
  @media (max-width:1100px){
    .pill{display:none}
    .nav-label{display:none}
  }
  @media (max-width:760px){
    .clock{display:none}
    .meta{display:none}
    .brand{padding:0 14px; gap:10px}
    .brand-text{font-size:13px}
    .nav-btn{padding:0 12px; gap:8px}
    .nav-text{display:none}
  }
</style>
</head>
<body>

<div class="shell">

  <!-- COMBINED BAR -->
  <div class="bar">

    <div class="brand">
      <div class="lp-mark">
        <svg viewBox="0 0 100 100"><path d="M50 8 L92 92 L72 92 L50 48 L28 92 L8 92 Z" fill="#e6113b"/></svg>
      </div>
      <div class="brand-text">LAUNCHPAD<span class="build">.BUILD</span><span class="ai">AI</span></div>
    </div>

    <div class="nav" id="nav">
      <div class="nav-label">PROGRAMS</div>

      <button class="nav-btn" data-src="lockheed-martin.html" data-status="crit">
        <div class="nav-mark">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L14.6 9 L22 9 L16 13.5 L18.2 21 L12 16.5 L5.8 21 L8 13.5 L2 9 L9.4 9 Z"
                  stroke="#e8e8ec" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-customer">Lockheed Martin</div>
          <div class="nav-code">LM-CF-001</div>
        </div>
        <div class="nav-status"></div>
      </button>

      <button class="nav-btn" data-src="l3harris.html" data-status="warn">
        <div class="nav-mark">
          <svg viewBox="0 0 24 24">
            <text x="12" y="16" text-anchor="middle"
                  font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700"
                  fill="#e8e8ec" letter-spacing="-0.5">L3</text>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-customer">L3Harris</div>
          <div class="nav-code">L3H-VS-001</div>
        </div>
        <div class="nav-status"></div>
      </button>

      <button class="nav-btn" data-src="james-avery.html" data-status="crit">
        <div class="nav-mark">
          <svg viewBox="0 0 24 24">
            <text x="12" y="16" text-anchor="middle"
                  font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700"
                  fill="#e8e8ec" letter-spacing="-0.3">JA</text>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-customer">James Avery</div>
          <div class="nav-code">JA-32E-001</div>
        </div>
        <div class="nav-status"></div>
      </button>

      <button class="nav-btn" data-src="mpower.html" data-status="warn">
        <div class="nav-mark">
          <svg viewBox="0 0 24 24">
            <text x="7" y="16" font-family="Space Grotesk, sans-serif"
                  font-size="13" font-weight="700" fill="#e8e8ec">m</text>
            <path d="M16 6 L13 13 L16 13 L14 18 L19 11 L16 11 Z" fill="#e6113b"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-customer">mPower</div>
          <div class="nav-code">MPOWER-TX-001</div>
        </div>
        <div class="nav-status"></div>
      </button>
    </div>

    <div class="meta">
      <div class="pill">PROJECTS &middot; 4 ACTIVE</div>
      <div class="clock"><span>LOCAL</span><b id="clk">--:--:--</b></div>
    </div>

  </div>

  <!-- VIEW -->
  <div class="view">
    <div class="loader" id="loader">LOADING BRIEFING</div>
    <iframe id="frame" src="about:blank" title="Program briefing"></iframe>
  </div>

</div>

<script>
  function tick(){
    const d = new Date(), p = n => String(n).padStart(2,'0');
    document.getElementById('clk').textContent =
      p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  const buttons = document.querySelectorAll('.nav-btn');
  const frame   = document.getElementById('frame');
  const loader  = document.getElementById('loader');

  function activate(src){
    buttons.forEach(b => b.classList.toggle('active', b.dataset.src === src));
    loader.classList.add('show');
    frame.src = src;
    if (location.hash !== '#' + src) {
      history.replaceState(null, '', '#' + src);
    }
  }

  frame.addEventListener('load', () => {
    if (frame.src && !frame.src.endsWith('about:blank')) {
      loader.classList.remove('show');
    }
  });

  buttons.forEach(btn => {
    btn.addEventListener('click', () => activate(btn.dataset.src));
  });

  const initialHash = location.hash.replace('#','');
  const initial = [...buttons].find(b => b.dataset.src === initialHash) || buttons[0];
  activate(initial.dataset.src);
</script>

</body>
</html>
